# Plain cron (min hour dom mon dow). Set tz for your team.
# Lean mode: only the lead runs on a schedule (two runs a week).
# Every other step runs when the previous step wakes it, right after
# that step's file is committed. No other role keeps its own routine.
tz: America/New_York
quiet_when_empty: true        # a run with nothing to do posts nothing
notify_humans_on: [topic_pick, publish_approval, failure]
routines:
  - step: lead-monday
    role: editor-in-chief
    cron: "0 12 * * 1"        # Mon 12:00 -> wake intake, then human topic pick
  - step: lead-friday
    role: editor-in-chief
    cron: "0 12 * * 5"        # Fri 12:00 -> human publish approval, chase stuck steps
handoffs:                     # who wakes whom once their file is committed
  - from: editor-in-chief     # Monday run
    wake: intake              # 01 pitches
  - from: intake
    wake: editor-in-chief     # topic pick, human approval, 01-topic.md
  - from: editor-in-chief     # after 01-topic.md
    wake: researcher          # 02
  - from: researcher
    wake: writer              # 03
  - from: writer
    wake: editor              # 04
  - from: editor
    wake: packager            # 05
  - from: packager
    wake: editor-in-chief     # human publish approval
  - from: editor-in-chief     # after the human posts
    wake: reviewer            # 06
